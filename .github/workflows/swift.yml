name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, ubuntu-latest ]

    steps:
    - uses: actions/checkout@v4
    - uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.1"

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

    - name: Build and test with coverage
      run: swift test --enable-code-coverage

  docs:
    name: Documentation
    runs-on: macos-15
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.1"

    - name: Build documentation
      run: |
        swift build --target GISToolsFIT \
          -Xswiftc -emit-symbol-graph \
          -Xswiftc -emit-symbol-graph-dir \
          -Xswiftc "$PWD/.build/symbol-graphs"
        mkdir -p .build/docc-symbols
        cp .build/symbol-graphs/GISToolsFIT.symbols.json .build/docc-symbols/
        xcrun docc convert Sources/GISToolsFIT/GISToolsFIT.docc \
          --additional-symbol-graph-dir .build/docc-symbols \
          --fallback-display-name GISToolsFIT \
          --fallback-bundle-identifier GISToolsFIT \
          --output-path .build/docs \
          --warnings-as-errors
