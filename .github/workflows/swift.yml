name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Build and test with coverage
        run: swift test --enable-code-coverage

  linux:
    name: test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:latest

    steps:
      - uses: actions/checkout@v4
      - name: Install zlib
        run: apt-get update && apt-get install -y zlib1g-dev
      - name: Build and test with coverage
        run: swift test --enable-code-coverage

  docs:
    name: documentation
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Build documentation
        run: |
          swift build --target GISToolsFIT \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc "$PWD/.build/symbol-graphs"
          mkdir -p .build/docc-symbols
          cp .build/symbol-graphs/GISToolsFIT.symbols.json .build/docc-symbols/
          xcrun docc convert Sources/GISToolsFIT/GISToolsFIT.docc \
            --additional-symbol-graph-dir .build/docc-symbols \
            --fallback-display-name GISToolsFIT \
            --fallback-bundle-identifier GISToolsFIT \
            --output-path .build/docs \
            --warnings-as-errors
